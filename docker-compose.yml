services:
  postgres:
    image: postgres:15-alpine
    env_file: ".env"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ".env"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app:Z
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: ".env"
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules:Z
    depends_on:
      - backend

volumes:
  postgres_data:
